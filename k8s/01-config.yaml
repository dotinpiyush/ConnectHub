apiVersion: v1
kind: ConfigMap
metadata:
  name: connecthub-config
  namespace: connecthub
data:
  PORT: "5000"
  MONGO_URI: "mongodb://mongo-service:27017/connecthub"
  CLIENT_URL: "http://connecthub-frontend-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: connecthub-secret
  namespace: connecthub
type: Opaque
stringData:
  # Replace with a strong secret before deploying; never commit real secrets to git.
  JWT_SECRET: "replace_with_a_long_random_secret"
