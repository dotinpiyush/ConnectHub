version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: connecthub-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: connecthub-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/connecthub
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: connecthub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
